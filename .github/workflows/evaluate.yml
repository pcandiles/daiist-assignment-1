name: Evaluate models

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Train models (main.py train)
        run: uv run python main.py train

      - name: Evaluate saved models on the test set
        run: uv run pytest tests/test_evaluation.py -v

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics
          path: evaluation_metrics.json
          if-no-files-found: ignore
